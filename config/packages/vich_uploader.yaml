vich_uploader:
    db_driver: orm
    metadata:
        type: attribute
    mappings:
        modules:
            uri_prefix: /images/modules
            upload_destination: '%kernel.project_dir%/public/images/modules'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
        ressources:
            uri_prefix: /documents
            upload_destination: '%kernel.project_dir%/public/documents'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
        blocs:
            uri_prefix: /blocs
            upload_destination: '%kernel.project_dir%/public/blocs'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
